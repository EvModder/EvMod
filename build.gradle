plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id "maven-publish"
}

group = project.maven_group
version = project.mod_version
base { archivesName = project.mod_name + "-" + project.minecraft_version}

// These get passed to src/main/java/resources/fabric.mod.json
processResources {
	inputs.property("mod_id", mod_id)
	inputs.property("mod_name", mod_name)
	inputs.property("mod_version", mod_version)
	inputs.property("loader_version", loader_version)
	inputs.property("minecraft_version", minecraft_version)
	inputs.property("malilib_version", malilib_version)

	filesMatching("fabric.mod.json") {
		expand([
			mod_id				: mod_id,
			mod_name			: mod_name,
			mod_version			: mod_version,
			loader_version		: loader_version,
			minecraft_version	: minecraft_version,
			malilib_version		: malilib_version
		])
	}
}

repositories {
	// https://docs.gradle.org/current/userguide/declaring_repositories.html
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// You should only use this when depending on other mods.

	maven {
		url = "https://maven.fallenbreath.me/releases" // conditional-mixin, a transitive MaLiLib dependency
		content { includeGroup("me.fallenbreath") }
	}
	maven { url = "https://jitpack.io" } // MaLiLib
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}" // Technically optional
	implementation "com.github.sakura-ryoko:malilib:${project.minecraft_version}-${project.malilib_version}"
	implementation files("libs/baritone-api-fabric-${project.baritone_version}.jar")
}

// https://github.com/EvModder/EvLib
def evLibSourceDir = file("../../Plugins/EvLib/src")
sourceSets.main.java {
	srcDir evLibSourceDir
	include "net/evmodder/evmod/**"
	include "net/evmodder/EvLib/util/**"
}

eclipse {
	project.file.whenMerged { eclipseProject ->
		eclipseProject.linkedResources.removeAll { link ->
			link.name in ["EvLib", "util"] && link.location?.endsWith("/EvLib/src")
		}
		eclipseProject.linkedResources.find { link ->
			link.name == "src" && link.location == evLibSourceDir.absolutePath
		}.name = "EvLib"
	}
	classpath.file.whenMerged { eclipseClasspath ->
		eclipseClasspath.entries.removeAll { entry ->
			entry.kind == "src" && entry.path in ["EvLib", "util"]
		}
		eclipseClasspath.entries.find { entry ->
			entry.kind == "src" && entry.path == "src" &&
					entry.includes.contains("net/evmodder/EvLib/util/**")
		}.path = "EvLib"
		eclipseClasspath.entries.find { entry ->
			entry.kind == "con" && entry.path.startsWith("org.eclipse.jdt.launching.JRE_CONTAINER")
		}.path = "org.eclipse.jdt.launching.JRE_CONTAINER"
	}
}

tasks.named("eclipseJdt") { enabled = false }

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and add to the "build" task.
	// If you remove this line, sources will not be generated.
//	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

compileJava.options.encoding = "UTF-8"
tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

jar {
	from("LICENSE") { rename { "${it}_${base.archivesName}"} }
}


publishing {
	// https://docs.gradle.org/current/userguide/publishing_maven.html
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.base.archivesName
			from components.java
		}
	}
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// Repositories here are used for publishing your artifact, not retrieving dependencies.
	}
}